<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" width="700" height="220"
     role="img" aria-label="RMS — Records Management System">
  <!-- Full lockup: seal + wordmark. Use on light backgrounds at 260px wide or more;
       below that the ribbon and tagline stop reading — use logo.svg instead. -->
  <defs>
    <style>
      .ink { fill: #3d4a63; }
      .brass { fill: #9D5068; }
      .cream { fill: #f6b1ce; }
      .soft { fill: #6e7c93; }
    </style>
  </defs>

  <!-- Seal -->
  <circle cx="110" cy="110" r="98" fill="none" stroke="#3d4a63" stroke-width="3"/>
  <g stroke="#3d4a63" stroke-width="2.4" stroke-linecap="round">
    <line x1="110.0" y1="12.0" x2="110.0" y2="22.0"/>
    <line x1="147.5" y1="19.5" x2="143.7" y2="28.7"/>
    <line x1="179.3" y1="40.7" x2="172.2" y2="47.8"/>
    <line x1="200.5" y1="72.5" x2="191.3" y2="76.3"/>
    <line x1="208.0" y1="110.0" x2="198.0" y2="110.0"/>
    <line x1="200.5" y1="147.5" x2="191.3" y2="143.7"/>
    <line x1="179.3" y1="179.3" x2="172.2" y2="172.2"/>
    <line x1="147.5" y1="200.5" x2="143.7" y2="191.3"/>
    <line x1="110.0" y1="208.0" x2="110.0" y2="198.0"/>
    <line x1="72.5" y1="200.5" x2="76.3" y2="191.3"/>
    <line x1="40.7" y1="179.3" x2="47.8" y2="172.2"/>
    <line x1="19.5" y1="147.5" x2="28.7" y2="143.7"/>
    <line x1="12.0" y1="110.0" x2="22.0" y2="110.0"/>
    <line x1="19.5" y1="72.5" x2="28.7" y2="76.3"/>
    <line x1="40.7" y1="40.7" x2="47.8" y2="47.8"/>
    <line x1="72.5" y1="19.5" x2="76.3" y2="28.7"/>
  </g>
  <circle cx="110" cy="110" r="78" class="ink"/>
  <circle cx="110" cy="110" r="72" fill="none" stroke="#9D5068" stroke-width="2"/>
  <text x="110" y="128" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="58" font-weight="700" class="cream" letter-spacing="1">RMS</text>
  <path d="M 46 152 Q 110 176 174 152 L 174 168 Q 110 190 46 168 Z" class="brass"/>
  <text x="110" y="167" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="10.5" font-weight="700" fill="#fbe9f0" letter-spacing="1.6">ON&#160;RECORD</text>

  <!-- Wordmark -->
  <text x="248" y="106" font-family="Georgia, 'Times New Roman', serif" font-size="54"
        font-weight="700" class="ink" letter-spacing="0.5">RMS</text>
  <text x="250" y="132" font-family="Arial, Helvetica, sans-serif" font-size="14"
        font-weight="600" class="soft" letter-spacing="4">RECORDS MANAGEMENT SYSTEM</text>
  <rect x="250" y="144" width="140" height="3" class="brass"/>
  <text x="250" y="170" font-family="Georgia, 'Times New Roman', serif" font-style="italic"
        font-size="15" class="soft">Every file, accounted for.</text>
</svg>
